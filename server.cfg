## You CAN edit the following:
{{serverEndpoints}}
sv_maxclients {{maxClients}}        # You can change the max amount of players in your server here
sv_licenseKey "{{svLicense}}"
sv_enforceGameBuild 3751            # You can change game build here
set steam_webApiKey "none"
set mysql_connection_string "{{dbConnectionString}}"

## You SHOULD edit the following:
sv_hostname "{{serverName}} powered by {{recipeName}}!"
sets sv_projectName "[{{recipeName}}] {{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets tags "default, rig"            # Replace with server tags applicable to your server
sets locale "en-EN"                 # Replace with your language and location code, like en-US, pt-BR, etc
load_server_icon server_logo.png    # Replace with your logo 96x96px

##################################

## Permissions

add_ace group.admin command allow
add_ace group.admin command.quit deny
add_principal group.admin group.staff

{{addPrincipalsMaster}}

# Group Inheritance
add_ace group.staff rig.dev allow
add_ace group.staff rig.admin allow

## Initialisation

exec configs/convars.cfg            # Your framework configuration settings
exec configs/resources.cfg          # Your resources load order list (where you add scripts/maps/props/etc..)

